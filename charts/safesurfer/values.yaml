## Feeds are event sources for various kinds of data.
## They connect to postgres and watch changes, providing clients with a feed of changes.
## Each feed type is a single-instance StatefulSet with optional persistence for better availability.
## They are used to reduce load by avoiding fetching fresh data from postgres frequently, and also to enable deployments
## outside the cluster without exposing the postgres database directly.
## Clients receive a key-value database of the relevant data, which is used directly by the DNS.
## The feed types share many common parameters, parameters that need explanation are listed below:
## - extraInstances (where supported): Define extra feed instances. Each array element has the same spec given
##                  under "default", and every field must be specified in each array element. Each array element must
##                  also have a field "name" to avoid clashes between names. This is only relevant when an ingress is
##                  defined - in-cluster deployments will connect to the "default" spec.
## - default: The default feed instance
##   - persistence: With this enabled, availability is increased, because clients can pick
##                  up where they left off when the pod restarts.
##     - storageClassName: Optionally define the name of a storage class that will be used for the data directory.
##     - storageClass: Optionally define a custom storage class that will be owned by the deployment
##                     (meaning it will be removed if the chart is uninstalled) and used by the feed,
##                     unless storageClassName is defined above.
##                     Must be a valid storage class object: https://kubernetes.io/docs/concepts/storage/storage-classes/
##   - service: Although the service is password-protected, it does not use TLS, so if the LoadBalancer type is selected, annotations should be used to
##              restrict to an internal LoadBalancer.
##   - ingress (where supported): Open the feed to the internet, optionally further protected by source IP. This does use TLS.
##   - maxBatchSize/maxBatchDuration: As operations are made to the database, batches are collected. They are sent when one of the
##                                    constraints is met. Making these values larger increases memory usage and makes live-updates
##                                    slower, but improves network efficiency.
##                                    Note: maxBatchSize is based on a worse-case calculation. It is very unlikely that updates
##                                    will use anywhere near as much as it specifies.
##   - batchBufferSize: Keep a buffer of this many batches for each client. The connection will fail if they
##                      cannot consume the buffer in time. Increasing these values consumes more memory but is
##                      more tolerant of poorer connections to clients. 
##   - maxListenerRetainDuration: The max amount of time to keep connection state around waiting for clients to reconnect.
##                                Increasing this uses more memory, but is more tolerant of poor network connections.
##   - batchHistoryLength: Keep the most recent batchHistoryLength operations so that clients that
##                         have been disconnected for a short amount of time can get back up to speed quickly.
##                         If a client has been disconnected long enough that they would require data no longer
##                         in the in-memory history, they will have to complete a lengthier full rebuild process.
##   - lmdb: Whether to use LMDB as the backing storage. This is optimal for some types of feed, but not others.
##           The default is generally the best option.
##   - mapSize: The maximum size of the LMDB database, if enabled. On linux, this is not a disk-space or memory requirement
##              and should be set as large as possible, per http://www.lmdb.tech/doc/group__mdb.html#gaa2506ec8dab3d969b0e609cd82e619e5.
##   - segmentation (where supported): If enabled, when data is fully rebuilt, it is done in batches instead
##                   of all at once. When segmentation is enabled, the time for a full rebuild scales
##                   with the amount of data, and the memory usage remains the same. When segmentation
##                   is disabled, the time for a full rebuild scales better, but memory usage grows
##                   with the amount of data.
##   - pgIterSize: The amount of rows to get at once from postgres. Higher values speed up the sync process at the cost of using more memory.
##   - liveUpdateMaxBatchSize: The max amount of items to live-update at once.
##   - liveUpdateMaxDelay: The max amount of time to wait for more live-updates to come in before doing them all.
##   - fullRebuildInterval: Fully rebuild the database on this interval. This is to catch modifications that did not emit a postgres notification.
##   - fullRebuildWindow: Add a random window around the fullRebuildInterval.
##   - maxIdleConns/maxIdleConns: Configure client-side postgres connection pooling. Does not usually need to updated for feeds. 
##   - maxConcurrentLiveUpdates: The max amount of live updates that may be completed concurrently. Generally, each concurrent live updates uses
##     a postgres connection.
##   - initLimit: The max amount of clients that may fully rebuild themselves from the feed at the same time.
##   - listenerTimeout: The amount of time to wait before restarting if postgres live updates aren't working, or 0 to never restart.
feeds:
  ## Distributes data needed by DNS conainers.
  dns:
    extraInstances: []
    default:
      enabled: false
      image: registry.gitlab.com/safesurfer/core/apps/dns-feed:1.0.2
      logLevel: info
      lmdb: true
      persistence:
        enabled: false
        storageClassName:
        storageClass:
        size: 10Gi
      ## Configure client access to the feed by providing a username/password.
      ## This also determines the subsection of categories/users the DNS has access to.
      ## This is a YAML file provided as a string, so you can use --set-file to keep it out
      ## of the values if you wish.
      clientConfig: |-
        # client1: # this is the username
        #   password: test
        #   # Example to exclude category ID of 1. If "exclude" is omitted or false, this example would *only include*
        #   # category ID of 1 instead.
        #   # categories:
        #   #   exclude: true
        #   #   list:
        #   #   - 1
        #   # Example to exclude routers or devices where metadata-key=metadata-value.
        #   # devices:
        #   #   exclude: true
        #   #   types:
        #   #   - type: router
        #   #   - meta:
        #   #     - metadata-key
        #   #     - metadata-value
        #   # Example to exclude users where metadata-key=metadata-value.
        #   # users:
        #   #   exclude: true
        #   #   types:
        #   #   - meta:
        #   #     - metadata-key
        #   #     - metadata-value
      service:
        type: ClusterIP
        port: 80
        externalIPs: []
        loadBalancerIP:
        annotations:
        loadBalancerSourceRanges:
        isGCPNEG: false
      ## NOTE: DNS feeds serve gRPC. Traefik does not serve that on a standard Ingress.
      ## Disable this ingress and use customManifests with an IngressRoute, scheme h2c.
      ingress:
        enabled: false
        host:
        class:
        ## Custom annotations to add to the ingress resource.
        annotations: {}
        tls:
          http01: true
          custom:
            enabled: false
            cert:
            key:
          secretName:
      maxBatchSize: "1GB"
      maxBatchDuration: 1s
      batchBufferSize: 500
      maxListenerRetainDuration: 1m
      batchHistoryLength: 300_000
      mapSize: 1TB
      initLimit: 1
      listenerTimeout: 30m
      accountSegmentation:
        enabled: true
        size: 50_000
      domainPgIterSize: 50_000
      accountPgIterSize: 50_000
      domainLiveUpdateMaxBatchSize: 100
      domainLiveUpdateMaxDelay: 10s
      categoryOptionLiveUpdateMaxBatchSize: 1
      categoryOptionLiveUpdateMaxDelay: 1s
      categoryLiveUpdateMaxBatchSize: 1
      categoryLiveUpdateMaxDelay: 1s
      accountLiveUpdateMaxBatchSize: 100
      accountLiveUpdateMaxDelay: 1s
      accountPlanAheadDuration: 168h
      accountFullRebuildInterval: 24h
      accountFullRebuildWindow: 4h
      categoryFullRebuildInterval: 30m
      categoryOptionFullRebuildInterval: 30m
      domainFullRebuildInterval: 24h
      domainFullRebuildWindow: 4h
      ## Setting this to true reduces memory usage but can interrupt
      ## live updates while a domain full rebuild is running.
      streamDomains: true
      port: 8080
      maxIdleConns: 0
      maxIdleConns: 0
      resources:
        requests:
          memory: 2.5Gi
          cpu: 100m
        limits:
          memory: 5Gi
          cpu: '1'
  ## Distributes whole blocking model data.
  blocking:
    default:
      enabled: false
      image: registry.gitlab.com/safesurfer/core/apps/blocking-feed:1.0.0-dev068
      logLevel: info
      lmdb: true
      persistence:
        enabled: false
        storageClassName:
        storageClass:
        size: 20Gi
      username: abm
      password:
      service:
        type: ClusterIP
        port: 80
        externalIPs: []
        loadBalancerIP:
        annotations:
        loadBalancerSourceRanges:
        isGCPNEG: false
      maxBatchSize: "256MB"
      maxBatchDuration: 1s
      batchBufferSize: 50
      maxListenerRetainDuration: 1m
      batchHistoryLength: 1000
      mapSize: 1TB
      liveUpdateMaxBatchSize: 50
      liveUpdateMaxDelay: 10s
      fullRebuildInterval: 24h
      port: 8080
      maxIdleConns: 0
      maxOpenConns: 0
      iterSize: 50_000
      maxConcurrentLiveUpdates: 5
      lastUpdateMapSize: 1TB
      subFeedMaxRecvSize: 1GB
      messageTimeout: 5m
      initLimit: 1
      listenerTimeout: 30m
      resources:
        requests:
          memory: 300Mi
          cpu: 10m
        limits:
          memory: 600Mi
          cpu: 100m
  ## Distributes subscription and quota info
  subscription:
    default:
      enabled: false
      image: registry.gitlab.com/safesurfer/core/apps/subscription-feed:1.0.1
      logLevel: info
      lmdb: true
      persistence:
        enabled: false
        storageClassName:
        storageClass:
        size: 20Gi
      username: subfeed
      password:
      segmentation:
        enabled: true
        size: 50_000
      service:
        type: ClusterIP
        port: 80
        externalIPs: []
        loadBalancerIP:
        annotations:
        loadBalancerSourceRanges:
        isGCPNEG: false
      maxBatchSize: "256MB"
      maxBatchDuration: 1s
      batchBufferSize: 500
      maxListenerRetainDuration: 1m
      batchHistoryLength: 10_000
      mapSize: 1TB
      liveUpdateMaxBatchSize: 100
      liveUpdateMaxDelay: 10s
      port: 8080
      maxIdleConns: 0
      maxOpenConns: 0
      iterSize: 50000
      initLimit: 1
      listenerTimeout: 30m
      resources:
        requests:
          memory: 3Gi
          cpu: 50m
        limits:
          memory: 5Gi
          cpu: '1'
  ## Distributes auth info, used to validate auth tokens. Auth tokens themselves are not included in the feed.
  auth:
    default:
      enabled: false
      image: registry.gitlab.com/safesurfer/core/apps/auth-feed:1.0.1
      logLevel: info
      lmdb: false
      persistence:
        enabled: false
        storageClassName:
        storageClass:
        size: 20Gi
      username: authfeed
      password:
      segmentation:
        enabled: true
        size: 50_000
      service:
        type: ClusterIP
        port: 80
        externalIPs: []
        loadBalancerIP:
        annotations:
        loadBalancerSourceRanges:
        isGCPNEG: false
      maxBatchSize: "256MB"
      maxBatchDuration: 1s
      batchBufferSize: 500
      maxListenerRetainDuration: 1m
      batchHistoryLength: 10_000
      mapSize: 1TB
      liveUpdateMaxBatchSize: 100
      liveUpdateMaxDelay: 10s
      fullRebuildInterval: 24h
      port: 8080
      maxIdleConns: 0
