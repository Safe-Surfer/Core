  ## Notification configuration: Notifications are delivered via web push for certain events.
  notifications:
    ## Enable whether users can sign up for notifications
    enabled: false
    ## The email to contact if there are notification issues (passed on to providers)
    email:
    ## The VAPID public key
    vapidPublicKey:
    ## The VAPID private key: recommended to specify on the CLI.
    vapidPrivateKey:

  ## Screencasts configuration
  screencasts:
    ## Whether to enable this feature
    enabled: false
    ## A string representing a GCP service account JSON file, used for storing screencast images in buckets.
    ## Recommended to specify on the CLI.
    gcpServiceAccount:
    ## The name of the bucket to use for images
    gcpBucketName:

  ## The sessions API is the replacement for the screencasts and notificationlog API.
  sessions:
    ## When double-verifying a submitted notification or screen text event using a
    ## text classification API, the Safe Surfer API will attempt to only send the
    ## relevant region of text. This parameter will be added to the start and
    ## end of relevant keywords to determine the relevant region. It may be
    ## further rounded up to the billing character interval of the text classification
    ## API. Setting this to a large value effectively sends the whole text.
    textClassificationPaddingSize: 35
    ## How many screen-event classification jobs the API runs at once.
    ## The process reads this at startup even when no classification provider is configured.
    textClassificationSubmitJobsMax: 10
    ## If specified, encrypt stored images with this 32-byte AES-256 key
    ## provided in hex format.
    imageEncryptionKey: 

  ## Insights show the change in traffic over a time period compared to a previous time period.
  ## They are used in the dashboard and alert emails, if configured.
  insights:
    ## Weightings to decide which insights are most important.
    factors:
      priority: 100
      before: 0.5
      after: 0.5
      change: 1

  ## Configure daily cleanup tasks. This deletes data past its expiration date and
  ## resets quotas and limits that apply daily or weekly.
  dailyCleanup:
    enabled: true
    maxConcurrency: 10
    ## The API also uses these parameters
    quotaLogMaxBatchDuration: 1m
    quotaLogMaxBatchSize: 1000
    image: registry.gitlab.com/safesurfer/core/apps/daily-cleanup:1.4.0
    maxIdleConns: 0
    maxOpenConns: 0
    logLevel: info
    ## Default resources have conservative limits but no requests
    ## to ensure the container can schedule.
    resources:
      limits:
        memory: "128Mi"
        cpu: "100m"

  ## Deploy the inbuilt text classification provider, which can be used by creating
  ## a text classification provider with the platform "internal".
  ## This requires redis to be enabled.
  textClassification:
    enabled: false
    replicas: 1
    ## The worker accepts jobs from the queue and takes minimal resources.
    image: registry.gitlab.com/safesurfer/core/apps/text-classification-worker:1.1.0
    ## The modelImage contains the actual model.
    modelImage: registry.gitlab.com/safesurfer/core/apps/text-classification-builtin:1.1.0
    ## For best response time, set to match the amount of threads available on the
    ## nodes the deployment will be run on.
    numThreads: 4
    ## Drives BOTH the worker's APP_MAX_CONCURRENT_JOBS (how many Redis jobs it
    ## pulls in parallel) AND llama-server's LLAMA_ARG_PARALLEL (n_parallel
    ## continuous-batching slots). The two must match: more worker concurrency
    ## than llama-server slots holds Redis jobs while requests queue at the
    ## HTTP layer; more slots than worker concurrency wastes model capacity.
    ## Note that llama-server splits its context across slots, so raising this
    ## reduces n_ctx per slot.
    maxConcurrentJobs: 4
    ## Cap for llama-server's per-slot prompt cache, in MiB. llama.cpp's default
    ## is 8192 MiB, which exceeds the pod memory limit under sustained load and
    ## causes OOMKilled restarts. 1024 MiB is enough to retain the shared
    ## system-prompt prefix (the high-value cache entry) while staying well
    ## under typical pod memory budgets. Increase if you raise the pod memory
    ## limit and want a longer prompt-cache tail.
    cacheRamMiB: 1024
    ## When true, the worker sends response_format json_schema so llama-server
    ## constrains output to {O,M,S,V,D} integers in [0,9] (prevents garbled JSON).
    ## Requires a modern llama.cpp server that accepts OpenAI json_schema.
    guidedJSON: true
    ## Max amount of time jobs can run, which affects the maximum length of text that can be
    ## classified, depending on the speed of the nodes.
    maxDuration: 10m
    ## Max amount of time to keep job results - this only affects the likelihood of job
    ## recovery if the API goes down.
    keepResultFor: 10m
    ## Max amount of queued jobs before submission fails, or 0 for no limit.
    maxQueued: 0
    ## Timeout for saving "recovered" jobs that complete outside of the scope
    ## of an API request.
    saveTimeout: 20s
    ## The resources for the modelImage. Memory should not generally be changed unless the
    ## modelImage is being changed, but CPU can be scaled up or down to affect
    ## the speed of classifications.
    resources:
      requests:
        cpu: '1.5'
        memory: 6000Mi
      limits:
        cpu: '4'
        memory: 7000Mi
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 10
      targetAverageCPUUtilization: 100
    ## Due to the large resource requirements, it may be desirable to host on a separate node pool.
    nodeSelector: {}
    tolerations: []

