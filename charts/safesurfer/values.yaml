      resources:
        requests:
          memory: 32Mi
          cpu: 100m
        limits:
          memory: 128Mi
          cpu: '1'
  ## Distributes info on text classification jobs.
  smm:
    default:
      enabled: false
      image: registry.gitlab.com/safesurfer/core/apps/smm-feed:1.0.2
      logLevel: info
