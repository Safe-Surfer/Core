        - 308 # Delete subscription
        - 309 # App usage
        - 310 # Delete app usage
        - 311 # App usage timeline
        - 312 # App usage summary
        - 314 # Search
        - 315 # App usage by device
    {{- if .Values.api.rolesConfig }}
      {{- toYaml .Values.api.rolesConfig | nindent 6 }}
    {{- end }}
    mobileConfig:
      {{- toYaml .Values.api.devices.appleMobileConfig | nindent 6 }}
{{- end }}