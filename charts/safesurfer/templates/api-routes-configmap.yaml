        - 259 # Set device group
        - 260 # Delete group preview
        - 261 # Delete device group
        - 262 # Device group icon
        - 263 # Blocking
        - 264 # Add deadline
        - 265 # Add timer
        - 266 # Add timetable
        - 267 # Update deadline
        - 268 # Update timer
