{{- if .Values.feeds.subscription.default.enabled }}
# The custom storage class, if enabled.
{{- if and .Values.feeds.subscription.default.persistence.enabled .Values.feeds.subscription.default.persistence.storageClass }}
---
{{ toYaml .Values.feeds.subscription.default.persistence.enabled .Values.feeds.subscription.default.persistence.storageClass }}
{{- end}}
# The PVC, if enabled.
{{- if .Values.feeds.subscription.default.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "name" (dict "Release" .Release "name" (printf "%s-%s" "subscription-feed" "default") "nameOverride" .Values.feeds.subscription.default.nameOverride) }}
  namespace: {{ include "ns" (dict "Values" .Values "Release" .Release "IndividualNamespace" .Values.api.namespace) }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.feeds.subscription.default.persistence.size }}
  {{- if .Values.feeds.subscription.default.persistence.storageClassName }}
  storageClassName: {{ .Values.feeds.subscription.default.persistence.storageClassName }}
  {{- else if .Values.feeds.subscription.default.persistence.storageClass.metadata.name }}
  storageClassName: {{ .Values.feeds.subscription.default.persistence.storageClass.metadata.name }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "name" (dict "Release" .Release "name" (printf "%s-%s" "subscription-feed" "default") "nameOverride" .Values.feeds.subscription.default.nameOverride) }}-auth
  namespace: {{ include "ns" (dict "Values" .Values "Release" .Release "IndividualNamespace" .Values.api.namespace) }}
type: Opaque
data:
  username: {{ .Values.feeds.subscription.default.username | b64enc | quote }}
  password: {{ required "subscription feed password required" .Values.feeds.subscription.default.password | b64enc | quote }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "name" (dict "Release" .Release "name" (printf "%s-%s" "subscription-feed" "default") "nameOverride" .Values.feeds.subscription.default.nameOverride) }}
  namespace: {{ include "ns" (dict "Values" .Values "Release" .Release "IndividualNamespace" .Values.api.namespace) }}
spec:
  replicas: 1
  serviceName: {{ include "name" (dict "Release" .Release "name" (printf "%s-%s" "subscription-feed" "default") "nameOverride" .Values.feeds.subscription.default.nameOverride) }}
  selector:
    matchLabels:
      app: {{ include "name" (dict "Release" .Release "name" (printf "%s-%s" "subscription-feed" "default") "nameOverride" .Values.feeds.subscription.default.nameOverride) }}
      {{- if .Values.feeds.subscription.default.lmdb }}
      lmdb-feed: '1'
      {{- end }}
  template:
    metadata:
      labels:
        app: {{ include "name" (dict "Release" .Release "name" (printf "%s-%s" "subscription-feed" "default") "nameOverride" .Values.feeds.subscription.default.nameOverride) }}
        {{- if .Values.feeds.subscription.default.lmdb }}
        lmdb-feed: '1'
        {{- end }}
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "2112"
        prometheus.io/scrape: "true"
        #
        # Ensure rolling deployments when mounted secrets change.
        #
        {{ if .Values.db.external.enabled }}
        checksum/db-login-password: {{ .Values.db.external.pguser | sha256sum }}
        checksum/db-login-username: {{ .Values.db.external.pgpassword | sha256sum }}
        {{ end }}
        {{ if .Values.db.inCluster.enabled }}
        checksum/internal-db-login-username: {{ .Values.db.inCluster.pguser | sha256sum }}
        {{ end }}
        checksum/username: {{ .Values.feeds.subscription.default.username | sha256sum }}
        checksum/password: {{ .Values.feeds.subscription.default.password | sha256sum }}
        checksum/routes-config: {{ include (print $.Template.BasePath "/api-routes-configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        fsGroup: 250
      imagePullSecrets:
      - name: {{ include "name" (dict "Release" .Release "name" "api" "nameOverride" .Values.api.nameOverride) }}-gitlab-registry
      automountServiceAccountToken: false
      volumes:
      {{- if .Values.feeds.subscription.default.persistence.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "name" (dict "Release" .Release "name" (printf "%s-%s" "subscription-feed" "default") "nameOverride" .Values.feeds.subscription.default.nameOverride) }}
      {{- end }}
      - name: tmp
        emptyDir: {}
      - name: config
        secret:
          secretName: {{ include "name" (dict "Release" .Release "name" (printf "%s-%s" "subscription-feed" "default") "nameOverride" .Values.feeds.subscription.default.nameOverride) }}
      - name: routes-config
        configMap:
          {{- if (and .Values.testFlags .Values.testFlags.legacyNames) }}
          name: routes-config
          {{- else }}
          name: {{ include "name" (dict "Release" .Release "name" "api" "nameOverride" .Values.api.nameOverride) }}-routes-config
          {{- end }}
          optional: false
      containers:
      - name: {{ include "name" (dict "Release" .Release "name" (printf "%s-%s" "subscription-feed" "default") "nameOverride" .Values.feeds.subscription.default.nameOverride) }}
        image: {{ .Values.feeds.subscription.default.image }}
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          privileged: false
          runAsUser: 250
          runAsGroup: 250
        imagePullPolicy: IfNotPresent
        volumeMounts:
        {{- if .Values.feeds.subscription.default.persistence.enabled }}
        - name: data
          mountPath: /data/lmdb
        {{- end }}
        - name: tmp
          mountPath: /tmp
        - name: routes-config
          mountPath: /var/safesurfer/config/routes-config.yaml
          subPath: routes-config.yaml
        ports:
        - name: sub-feed
          containerPort: {{ .Values.feeds.subscription.default.port }}
          protocol: TCP
        env:
          {{ include "loggingEnvs" (dict "level" .Values.feeds.subscription.default.logLevel) | indent 10 }}
          {{ include "dbEnvs" . | indent 10 }}
          - name: APP_INIT_LIMIT
            value: {{ .Values.feeds.subscription.default.initLimit | int | quote }}
          - name: APP_LISTENER_TIMEOUT
            value: {{ .Values.feeds.subscription.default.listenerTimeout }}
          - name: APP_PORT
            value: {{ .Values.feeds.subscription.default.port | int | quote }}
          - name: APP_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ include "name" (dict "Release" .Release "name" (printf "%s-%s" "subscription-feed" "default") "nameOverride" .Values.feeds.subscription.default.nameOverride) }}-auth
                key: username
          - name: APP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ include "name" (dict "Release" .Release "name" (printf "%s-%s" "subscription-feed" "default") "nameOverride" .Values.feeds.subscription.default.nameOverride) }}-auth
                key: password
          - name: APP_ENABLE_LMDB
            value: {{ .Values.feeds.subscription.default.lmdb | quote }}
          - name: APP_PERSISTENT
            value: {{ .Values.feeds.subscription.default.persistence.enabled | quote }}
          - name: APP_PG_MAX_IDLE_CONNS
            value: {{ .Values.feeds.subscription.default.maxIdleConns | int | quote }}
          - name: APP_PG_MAX_OPEN_CONNS
            value: {{ .Values.feeds.subscription.default.maxOpenConns | int | quote }}
          - name: APP_LMDB_FEED_PORT
            value: {{ .Values.feeds.subscription.default.port | int | quote }}
          {{- if .Values.feeds.subscription.default.persistence.enabled }}
          - name: APP_BASE_DIR
            value: /data/lmdb
          {{- else }}
          - name: APP_BASE_DIR
            value: /tmp/lmdb
          {{- end }}
          - name: APP_BUFFER_SIZE
            value: {{ .Values.feeds.subscription.default.batchHistoryLength | int | quote }}
          - name: APP_SUBSCRIPTION_FEED_MAP_SIZE
            value: {{ .Values.feeds.subscription.default.mapSize }}
          - name: APP_MAX_WAITING_BATCHES
            value: {{ .Values.feeds.subscription.default.batchBufferSize | int | quote }}
          - name: APP_MAX_BATCH_DURATION
            value: {{ .Values.feeds.subscription.default.maxBatchDuration }}
          - name: APP_MAX_RECV_SIZE
            value: {{ .Values.feeds.subscription.default.maxBatchSize | quote }}
          - name: APP_POST_FULL_REBUILD_UPDATE_BATCH_SIZE
            value: {{ .Values.feeds.subscription.default.liveUpdateMaxBatchSize | int | quote }}
          - name: APP_MAX_LIVE_UPDATE_DELAY
            value: {{ .Values.feeds.subscription.default.liveUpdateMaxDelay | quote }}
          - name: APP_MAX_LIVE_UPDATE_BATCH_SIZE
            value: {{ .Values.feeds.subscription.default.liveUpdateMaxBatchSize | int | quote }}
          - name: APP_MAX_LISTENER_RETAIN
            value: {{ .Values.feeds.subscription.default.maxListenerRetainDuration }}
          - name: APP_CURSOR_SIZE
            value: {{ .Values.feeds.subscription.default.iterSize | int | quote }}
          - name: APP_CURSOR_NAME
            value: server_side_paging_subscription
          {{- if .Values.feeds.subscription.default.segmentation.enabled }}
          - name: APP_SEGMENT_SIZE
            value: {{ .Values.feeds.subscription.default.segmentation.size | int | quote }}
          {{- else }}
          - name: APP_SEGMENT_SIZE
            value: '0'
          {{- end }}
          - name: APP_API_CONFIG
            value: /var/safesurfer/config/routes-config.yaml
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 2
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
          tcpSocket:
            port: {{ .Values.feeds.subscription.default.port }}
        livenessProbe:
          failureThreshold: 2
          initialDelaySeconds: 1
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
          tcpSocket:
            port: {{ .Values.feeds.subscription.default.port }}
        resources:
          {{- toYaml .Values.feeds.subscription.default.resources | nindent 10 }}
---
# The service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "name" (dict "Release" .Release "name" (printf "%s-%s" "subscription-feed" "default") "nameOverride" .Values.feeds.subscription.default.nameOverride) }}
  namespace: {{ include "ns" (dict "Values" .Values "Release" .Release "IndividualNamespace" .Values.api.namespace) }}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    {{- if .Values.feeds.subscription.default.service.isGCPNEG }}
    cloud.google.com/neg: '{"exposed_ports": {"{{ .Values.feeds.subscription.default.service.port }}":{}}}'
    {{- end }}
    {{- with .Values.feeds.subscription.default.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ports:
  - name: sub-feed
    port: {{ .Values.feeds.subscription.default.service.port }}
    protocol: TCP
    targetPort: {{ .Values.feeds.subscription.default.port }}
  type: {{ .Values.feeds.subscription.default.service.type }}
  {{- if (or (eq .Values.feeds.subscription.default.service.type "LoadBalancer") (eq .Values.feeds.subscription.default.service.type "NodePort")) }}
  externalTrafficPolicy: Local
  {{- if .Values.feeds.subscription.default.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.feeds.subscription.default.service.loadBalancerIP }}
  {{- end }}
  {{- with .Values.feeds.subscription.default.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
  {{ toYaml . | nindent 2 }}
  {{- end }}
  sessionAffinity: ClientIP
  {{- end }}
  externalIPs:
{{- if .Values.feeds.subscription.default.service.externalIPs }}
{{- with .Values.feeds.subscription.default.service.externalIPs }}
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
  selector:
    app: {{ include "name" (dict "Release" .Release "name" (printf "%s-%s" "subscription-feed" "default") "nameOverride" .Values.feeds.subscription.default.nameOverride) }}
{{- end }}