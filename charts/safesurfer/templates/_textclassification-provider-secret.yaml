{{- define "textClassificationProviderSecret" }}
apiVersion: v1
kind: Secret
metadata:
  {{- if (and .Values.testFlags .Values.testFlags.legacyNames) }}
  name: textclassification-config-{{ .key }}
  {{- else }}
  name: {{ include "name" (dict "Release" .Release "name" (printf "textclassification-config-%s" .key)) }}
  {{- end }}
  namespace: {{ include "ns" (dict "Values" .Values "Release" .Release "IndividualNamespace" .targetNamespace) }}
type: Opaque
data:
  textclassification.yaml: {{ include "textClassificationProviderObject" (dict "Values" .Values "Release" .Release "key" .key) | b64enc | quote }}
{{- end }}