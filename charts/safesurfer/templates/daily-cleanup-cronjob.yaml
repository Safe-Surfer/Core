{{ if and .Values.api.enabled .Values.api.dailyCleanup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "name" (dict "Release" .Release "name" "daily-cleanup" "nameOverride" .Values.api.dailyCleanup.nameOverride) }}
  namespace: {{ include "ns" (dict "Values" .Values "Release" .Release "IndividualNamespace" .Values.api.namespace) }}
spec:
  schedule: 1 0 * * *
  concurrencyPolicy: Replace
  timeZone: "Etc/UTC"
  jobTemplate:
    spec:
      template:
        spec:
          volumes:
          - name: routes-config
            configMap:
              {{- if (and .Values.testFlags .Values.testFlags.legacyNames) }}
              name: routes-config
              {{- else }}
              name: {{ include "name" (dict "Release" .Release "name" "api" "nameOverride" .Values.api.nameOverride) }}-routes-config
              {{- end }}
              optional: false
          automountServiceAccountToken: false
          imagePullSecrets:
          - name: {{ include "name" (dict "Release" .Release "name" "api" "nameOverride" .Values.api.nameOverride) }}-gitlab-registry
          containers:
          - name: {{ include "name" (dict "Release" .Release "name" "daily-cleanup" "nameOverride" .Values.api.dailyCleanup.nameOverride) }}
            image: {{ .Values.api.dailyCleanup.image }}
            resources:
              {{- toYaml .Values.api.dailyCleanup.resources | nindent 14 }}
            volumeMounts:
            - name: routes-config
              mountPath: /var/safesurfer/config/routes-config.yaml
              subPath: routes-config.yaml
            env:
            - name: APP_QUOTA_LOG_MAX_BATCH_DURATION
              value: {{ .Values.api.dailyCleanup.quotaLogMaxBatchDuration | quote }}
            - name: APP_QUOTA_LOG_MAX_BATCH_SIZE
              value: {{ .Values.api.dailyCleanup.quotaLogMaxBatchSize | int | quote }}
            - name: APP_MAX_CONCURRENCY
              value: {{ .Values.api.dailyCleanup.maxConcurrency | int | quote }}
            - name: APP_API_CONFIG
              value: /var/safesurfer/config/routes-config.yaml
            # Include DB connection
            {{ include "dbEnvs" . | indent 12 }}
            {{ include "clickhouseEnvs" . | indent 12 }}
            - name: APP_CLICKHOUSE_READ_TIMEOUT
              value: {{ .Values.api.clickhouse.readTimeout | quote }}
            - name: APP_PG_MAX_IDLE_CONNS
              value: {{ .Values.api.dailyCleanup.maxIdleConns | int | quote }}
            - name: APP_PG_MAX_OPEN_CONNS
              value: {{ .Values.api.dailyCleanup.maxOpenConns | int | quote }}
            {{ include "loggingEnvs" (dict "level" .Values.api.dailyCleanup.logLevel) | indent 12 }}
          restartPolicy: OnFailure
{{ end }}